name: Release

# Push a tag like v0.2.0 to build widefive.app (universal), the DMG + zip, a signed Sparkle appcast and
# the Homebrew cask, then publish them as a GitHub Release. Everything here is Scripts/release.sh, which
# also runs on any Mac if Actions minutes run out.
#
# Secrets:
#   SPARKLE_PRIVATE_KEY          required — EdDSA key from Scripts/setup-sparkle-keys.sh
#   APPLE_DEVELOPER_ID_CERT      optional — base64 .p12 of a "Developer ID Application" certificate
#   APPLE_DEVELOPER_ID_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                                optional — with the cert, the app + DMG are signed and notarized;
#                                without them the build is ad-hoc signed (users see Gatekeeper's first-launch prompt).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.3.0. If the tag doesn't exist yet it's created on the latest main."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count, release notes = commits since last tag

      # "Run workflow" with a new version releases straight from main: no terminal needed. (A tag pushed with the
      # workflow's own token doesn't start a second run of this workflow.)
      - name: Use the tag, creating it on main if it's new
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          git fetch --tags --force origin
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "widefive ${TAG#v}" "origin/${{ github.event.repository.default_branch }}"
            git push origin "refs/tags/$TAG"
          fi
          git checkout -q "$TAG"
          git log --oneline -1

      - name: Use the newest Xcode (default 16.4 / Swift 6.1 is too old)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer"
          swift --version

      - name: Check the Sparkle key is configured
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret missing — run Scripts/setup-sparkle-keys.sh once (see README → Releasing)"
            exit 1
          fi

      - name: Import Developer ID certificate (optional)
        if: env.APPLE_DEVELOPER_ID_CERT != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Build, package, sign appcast and publish
        run: |
          set -o pipefail
          if ! Scripts/release.sh "$TAG" --publish 2>&1 | tee "$RUNNER_TEMP/release.log"; then
            tail -n 15 "$RUNNER_TEMP/release.log" | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widefive-${{ env.TAG }}
          path: dist/
          if-no-files-found: ignore
